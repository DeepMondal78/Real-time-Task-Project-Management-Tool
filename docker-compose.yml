version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  task-service:
    build: ./task-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002

  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - task-service